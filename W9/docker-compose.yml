name: seaweed-photo-gallery

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery
      POSTGRES_DB: gallery
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs-master:
    image: chrislusf/seaweedfs:4.54
    command: "master -ip=seaweedfs-master -mdir=/data -volumeSizeLimitMB=1024"
    ports: ["9333:9333"]
    volumes: ["seaweed-master-data:/data"]

  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.54
    command: "volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -dir=/data -max=0"
    depends_on: [seaweedfs-master]
    ports: ["8080:8080"]
    volumes: ["seaweed-volume-data:/data"]

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.54
    command: "filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer"
    depends_on: [seaweedfs-master, seaweedfs-volume]
    ports: ["8888:8888"]
    volumes: ["seaweed-filer-data:/data"]

  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.54
    command: "s3 -filer=seaweedfs-filer:8888 -port=8333 -config=/etc/seaweedfs/s3.json -concurrentFileUploadLimit=10 -concurrentUploadLimitMB=128 -inflightUploadDataTimeout=60s -idleTimeout=120"
    depends_on: [seaweedfs-filer]
    ports: ["8333:8333"]
    volumes:
      - "./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://gallery:gallery@postgres:5432/gallery?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://seaweedfs-s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: photo-gallery
      S3_ACCESS_KEY_ID: development-only
      S3_SECRET_ACCESS_KEY: development-only
      S3_FORCE_PATH_STYLE: "true"
      WEB_ORIGIN: http://localhost:5173
    depends_on: [postgres, redis, seaweedfs-s3]
    ports: ["3001:3001"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  postgres-data:
  redis-data:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:
